<style>

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(1200px 700px at 30% 20%, #f6f2ec, var(--bg)); font: 14px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 40px; overflow: hidden; }
  .stage { height: 100vh; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .phone { position: relative; background: #111; border-radius: 62px; padding: 14px; box-shadow: 0 0 0 2px #3a3a3c, 0 0 0 5px #1c1c1e, 0 40px 80px rgba(0,0,0,.28); transform-origin: center center; }

  .phone.se { border-radius: 44px; padding: 70px 14px; }
  .phone.se .screen { border-radius: 4px; }
  .phone.se .island, .phone.se .home { display: none; }

  .status { flex: 0 0 var(--sb); background: #0f1a33; color: #f3e9d6; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 38px; font-weight: 600; font-size: 16px; letter-spacing: .2px; position: relative; }
  .phone.se .status { padding: 0 10px; font-size: 13px; }
  .status .r { display: flex; gap: 6px; align-items: center; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 5; }
  iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; background: #fff; }
  .homebar { flex: 0 0 var(--hb); background: #fff; position: relative; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: #111; z-index: 5; }
  .panel { width: 300px; background: rgba(255,255,255,.75); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 18px; padding: 20px; flex: 0 0 auto; max-height: 92vh; overflow: auto; }
  .panel h1 { font-size: 17px; margin: 0 0 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .panel h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 16px 0 6px; letter-spacing: .5px; }
  .seg { display: flex; background: #e9e3da; border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 7px 4px; border-radius: 8px; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; }
  .seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 12px; background: #fff; }
  .btn { display: block; width: 100%; margin-top: 8px; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font: inherit; font-size: 13px; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .state { font-size: 12px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #f4efe7; }
  .state b { color: var(--accent); }
  @media (max-width: 860px) { .panel { display: none; } body { gap: 0; } }
</style>
</head>

<script>
(function () {
  var KEY_API = 'yume.guest.apiBase.v1';
  var PREF = 'yume.phoneframe.v1';
  var MODELS = { '15': { w: 393, h: 852, sb: 54, hb: 34 }, max: { w: 430, h: 932, sb: 54, hb: 34 }, se: { w: 375, h: 667, sb: 20, hb: 0 } };
  var ls = (function () { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return localStorage; } catch (e) { var m = {}; return { getItem: function (k) { return k in m ? m[k] : null; }, setItem: function (k, v) { m[k] = String(v); }, removeItem: function (k) { delete m[k]; }, get length() { return Object.keys(m).length; }, key: function (i) { return Object.keys(m)[i]; } }; } })();
  var pref = {}; try { pref = JSON.parse(ls.getItem(PREF) || '{}') || {}; } catch (e) {}
  var save = function () { try { ls.setItem(PREF, JSON.stringify(pref)); } catch (e) {} };

  var bytes = Uint8Array.from(atob(document.getElementById('payload').textContent.trim()), function (c) { return c.charCodeAt(0); });
  var html = new TextDecoder('utf-8').decode(bytes);
  var frame = document.getElementById('app');
  // srcdoc：跟外框同一個來源，App 的資料（localStorage）和外框共用
  var load = function () { frame.removeAttribute('srcdoc'); setTimeout(function () { frame.srcdoc = html; }, 30); };

  var clearGuest = function () { var ks = []; for (var i = 0; i < ls.length; i++) { var k = ls.key(i); if (k && k.indexOf('yume.guest.') === 0) ks.push(k); } ks.forEach(function (k) { ls.removeItem(k); }); };
  // 舊版存過「假資料／其他後端」的設定就清掉（現在固定接測試後端）
  if (ls.getItem(KEY_API) !== null) { clearGuest(); }

  var phone = document.getElementById('phone'), screen = document.getElementById('screen');
  var fit = function () {
    var m = MODELS[pref.model] || MODELS['15'];
    var pad = pref.model === 'se' ? 140 : 28;
    var total = m.h + pad, avail = window.innerHeight - 32;
    phone.style.transform = 'scale(' + Math.min(1, avail / total) + ')';
  };
  var setModel = function (k) {
    pref.model = MODELS[k] ? k : '15'; save();
    var m = MODELS[pref.model];
    screen.style.setProperty('--w', m.w + 'px'); screen.style.setProperty('--h', m.h + 'px');
    screen.style.setProperty('--sb', m.sb + 'px'); screen.style.setProperty('--hb', m.hb + 'px');
    phone.classList.toggle('se', pref.model === 'se');
    [].forEach.call(document.querySelectorAll('#model button'), function (b) { b.classList.toggle('on', b.dataset.v === pref.model); });
    fit();
  };
  document.getElementById('model').addEventListener('click', function (e) { var v = e.target.dataset && e.target.dataset.v; if (v) setModel(v); });
  window.addEventListener('resize', fit);

  document.getElementById('reload').addEventListener('click', load);
  document.getElementById('reset').addEventListener('click', function () {
    if (!confirm('清掉這台電腦上的客人資料（登入、打卡、道具…）？後端資料不會被刪。')) return;
    clearGuest(); load();
  });

  var tick = function () { var d = new Date(); document.getElementById('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
  tick(); setInterval(tick, 15000);

  setModel(pref.model || '15'); load();
})();
</script>
